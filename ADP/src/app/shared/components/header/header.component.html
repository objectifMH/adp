<header class="header">
    <a routerLink="/home">
        <div class="logo"><i class="fas fa-map-marker-alt"></i> &nbsp;ALCOOL DEPOT VENTE </div>
    </a>
    <!-- Icône du menu (hamburger ou croix) -->
    <div class="menu-icon" (click)="toggleMenu()">
        @if (!isMenuOpen) {
        <span>&#9776;</span> <!-- Hamburger icon -->
        } @else {
        <span>&#10005;</span> <!-- Croix pour fermer -->
        }
    </div>

    <!-- Navigation mobile-->
    <nav class="nav-mobile" [class.active]="isMenuOpen">
        <a routerLink="/home">Accueil</a>
        <a routerLink="/products">Produits</a>
        <a routerLink="/about">À propos</a>
        <a routerLink="/contact">Contact</a>
    </nav>

    <!-- Navigation desktop-->
    <nav class="nav-desktop">
        <a routerLink="/home">Accueil</a>
        <a routerLink="/products">Produits</a>
        <a routerLink="/about">À propos</a>
        <a routerLink="/contact">Contact</a>

    </nav>

    <!-- <button class="button">Acheter : +33 6 13 34 23 82</button> -->

</header>
