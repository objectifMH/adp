<div class="carousel" (mouseenter)="stopAutoSlide()" (mouseleave)="startAutoSlide()">
    <div class="slides">
        @for (slide of slides; track slide; let i = $index) {
        <div class="slide" [class.active]="currentSlide === i">
            <img [src]="slide.image" [alt]="slide.title">
            <div class="caption">
                <h3>{{ slide.title }}</h3>
                <!-- <p>{{ slide.description }}</p> -->
                <p [innerHTML]="slide.description"></p>
                <a [routerLink]="slide.ctaLink1" class="cta-button">
                    {{ slide.ctaText1 }}
                    <i class="fas fa-arrow-right"></i> <!-- Icône Font Awesome -->
                </a>
            </div>
        </div>
        }
    </div>
    <button class="prev" (click)="prevSlide()">&#10094;</button>
    <button class="next" (click)="nextSlide()">&#10095;</button>

    <div class="indicators">
        @for (slide of slides; track slide; let i = $index) {
        <span class="indicator" [class.active]="currentSlide === i" (click)="goToSlide(i)"></span>
        }
    </div>
</div>
